[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # function-call-in-default-argument: conflicts com Depends()/Query() do FastAPI
    "UP046", # PEP 695 generic syntax (class Foo[T]) para os schemas genéricos de paginação
]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["venv", "alembic"]
